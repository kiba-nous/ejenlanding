    <!--
      Netlify Forms detection target.

      Netlify parses the deployed HTML at build time to discover forms, so a
      React-rendered form is invisible to it. This hidden static twin registers
      the form; QuickConsultForm then POSTs to "/" with a matching form-name.
      Field names here must stay in sync with the fields it submits.
    -->
    <form name="konsultasi" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="konsultasi" />
      <input type="text" name="bot-field" />
      <input type="text" name="nama" />
      <input type="tel" name="whatsapp" />
      <input type="text" name="jenis_klien" />
